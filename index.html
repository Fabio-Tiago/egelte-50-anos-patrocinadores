<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Patrocinadores da celebração de 50 anos da Egelte Engenharia."
    />
    <meta name="theme-color" content="#e2be7a" />
    <title>Patrocinadores | Egelte 50 Anos</title>

    <style>
      :root {
        --fundo: #e2be7a;
        --azul-egelte: #183d62;
        --azul-egelte-escuro: #102b47;
        --texto: #282218;
        --branco: #fffdf8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--fundo);
        color: var(--texto);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .pagina {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: clamp(28px, 5vw, 64px) 0 clamp(40px, 7vw, 88px);
      }

      .cabecalho,
      .links {
        width: min(calc(100% - 36px), 1200px);
        margin-inline: auto;
      }

      .cabecalho {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-bottom: clamp(26px, 5vw, 54px);
      }

      .logo {
        display: block;
        width: clamp(260px, 40vw, 520px);
        max-width: 50%;
        height: auto;
      }

      .patrocinadores {
        width: 100%;
        overflow: hidden;
      }

      .patrocinadores picture {
        display: flex;
        width: 100%;
        justify-content: center;
        align-items: flex-start;
      }

      /*
       * Desktop/tablet: a arte respeita simultaneamente a largura e a altura
       * disponíveis. Em monitores muito largos ela deixa de crescer pela
       * largura quando atingir 72dvh, mantendo todos os patrocinadores visíveis.
       */
      .patrocinadores img {
        display: block;
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 72dvh;
        object-fit: contain;
        object-position: center top;
      }

      .links {
        padding-top: clamp(30px, 5vw, 58px);
        text-align: center;
      }

      .linksTitulo {
        font-size: clamp(22px, 3vw, 32px);
        line-height: 1.15;
        font-weight: 800;
        color: var(--texto);
        margin-bottom: 10px;
      }

      .linksTexto {
        max-width: 680px;
        margin: 0 auto clamp(22px, 4vw, 34px);
        font-size: clamp(15px, 2vw, 18px);
        line-height: 1.55;
        color: rgba(40, 34, 24, 0.78);
      }

      .botoes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        max-width: 1040px;
        margin: 0 auto;
      }

      .botao {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 12px 22px;
        border: 1.5px solid var(--azul-egelte);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: var(--azul-egelte-escuro);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-decoration: none;
        transition:
          transform 160ms ease,
          background 160ms ease,
          color 160ms ease,
          box-shadow 160ms ease;
      }

      .botao:hover {
        transform: translateY(-2px);
        background: var(--azul-egelte);
        color: var(--branco);
        box-shadow: 0 10px 24px rgba(24, 61, 98, 0.2);
      }

      .botao:active {
        transform: translateY(0);
      }

      .botao:focus-visible {
        outline: 3px solid var(--branco);
        outline-offset: 3px;
      }

      @media (max-width: 900px) {
        .cabecalho,
        .links {
          width: min(calc(100% - 32px), 1200px);
        }

        .botoes {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .cabecalho {
          padding-bottom: 20px;
        }

        .logo {
          width: min(82vw, 390px);
        }

        /* No mobile a arte vertical deve usar toda a largura, sem limite de altura. */
        .patrocinadores picture {
          display: block;
        }

        .patrocinadores img {
          width: 100%;
          max-width: 100%;
          max-height: none;
          height: auto;
        }

        .botoes {
          grid-template-columns: 1fr;
          max-width: 430px;
        }

        .botao {
          min-height: 50px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .botao {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="pagina">
      <header class="cabecalho">
        <img
          class="logo"
          src="/galeria/logo-egelte-50-anos.png"
          alt="Egelte 50 Anos"
          width="1512"
          height="351"
        />
      </header>

      <section class="patrocinadores" aria-label="Patrocinadores Egelte 50 Anos">
        <picture>
          <source
            media="(max-width: 640px)"
            srcset="/galeria/Rodape-Patrocinadores---V2---Mobile.jpg"
          />
          <img
            src="/galeria/Rodape-Patrocinadores---V2---HD.jpg"
            alt="Patrocinadores: Aeroar, Kepler Weber, Saur, Saturno, Energy Global e Vipp Mix"
            width="1920"
            height="1080"
          />
        </picture>
      </section>

      <section class="links" aria-labelledby="links-titulo">
        <h1 class="linksTitulo" id="links-titulo">Conheça nossos patrocinadores</h1>
        <p class="linksTexto">
          Escolha uma empresa para conhecer seu site e suas soluções.
        </p>

        <nav class="botoes" aria-label="Sites dos patrocinadores">
          <a class="botao" href="https://aeroar.com.br/" target="_blank" rel="noopener noreferrer">
            Aeroar
          </a>
          <a class="botao" href="https://kepler.com.br/" target="_blank" rel="noopener noreferrer">
            Kepler Weber
          </a>
          <a class="botao" href="https://www.saur.com.br/" target="_blank" rel="noopener noreferrer">
            Saur
          </a>
          <a class="botao" href="https://www.saturnosmart.com.br/" target="_blank" rel="noopener noreferrer">
            Saturno
          </a>
          <a class="botao" href="https://www.energyglobal.com.br/" target="_blank" rel="noopener noreferrer">
            Energy Global
          </a>
          <a class="botao" href="http://www.vippmix.com.br/" target="_blank" rel="noopener noreferrer">
            Vipp Mix
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
